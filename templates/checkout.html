<!DOCTYPE html>
<html>

<head>

    <title>OMS | Checkout</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
        }

        .container{
            width:1000px;
            margin:auto;
            background:white;
            padding:30px;
            margin-top:50px;
            border-radius:10px;
        }

        img{
            width:300px;
            border-radius:10px;
        }

        input, textarea{
            width:100%;
            padding:12px;
            margin-top:10px;
        }

        button{
            background:black;
            color:white;
            padding:15px 25px;
            border:none;
            margin-top:20px;
            cursor:pointer;
        }

        .food-box{
            margin-bottom:30px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🛒 Checkout</h1>

    <div class="food-box">

        <img src="{{ .menu.Image }}">

        <h2>{{ .menu.Name }}</h2>

        <p>{{ .menu.Description }}</p>

        <h3>Price: ${{ .menu.Price }}</h3>

    </div>

    <hr>

    <form action="/place-order" method="POST">

        <input type="hidden"
               name="menu_id"
               value="{{ .menu.ID }}">

        <label>First Name</label>

        <input type="text"
               name="customer_name"
               required>

        <label>Last Name</label>

        <input type="text"
               name="customer_surname"
               required>

        <label>Phone Number</label>

        <input type="text"
               name="phone"
               required>

        <label>Address</label>

        <textarea name="address"
                  required></textarea>

        <label>Email</label>

        <input type="email"
               name="email"
               required>

        <label>Quantity</label>

        <input type="number"
                id="quantity"
               name="quantity"
               value="1"
               min="1"
               required>


        <input type="hidden"
                id="price"
               name="price"
               value="{{ .menu.Price }}"
               required>

        <label>Total</label>

        <input type="number"
            id="total"
            name="total"
            readonly>

        <button type="submit">
            Place Order
        </button>

    </form>

</div>

</body>
<script>

    const quantityInput = document.getElementById("quantity");

    const totalInput = document.getElementById("total");

    const priceInput = document.getElementById("price");

    function updateTotal(){

        let quantity = parseInt(quantityInput.value) || 0;

        let price = parseFloat(priceInput.value) || 0;

        let total = price * quantity;

        totalInput.value = total.toFixed(2);

    }

    updateTotal();

    quantityInput.addEventListener("input", updateTotal);

</script>
</html>
