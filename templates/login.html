<!DOCTYPE html>
<html>

<head>

    <title>OMS | Login - Food Ordering System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body{
            background:#f5f5f5;
            font-family:Arial;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-box{
            width:450px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
        }

        .logo{
            text-align:center;
            margin-bottom:30px;
        }

        .logo h1{
            font-weight:bold;
        }

        .form-control{
            height:50px;
        }

        .btn-login{
            width:100%;
            height:50px;
            background:#212529;
            color:white;
            border:none;
        }

        .btn-login:hover{
            background:black;
        }

        .register-link{
            text-align:center;
            margin-top:20px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="logo">

        <h1>🍔 Food Ordering</h1>

        <p class="text-muted">
            Login to continue
        </p>

    </div>

    <form action="/login" method="POST">

        <div class="mb-3">

            <label class="form-label">
                Email Address
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="fa fa-envelope"></i>
                </span>

                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter Email"
                       required>

            </div>

        </div>

        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="fa fa-lock"></i>
                </span>

                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter Password"
                       required>

            </div>

        </div>

        <button type="submit"
                class="btn btn-login">

            <i class="fa fa-right-to-bracket"></i>
            Login

        </button>

    </form>
<!-- 
    <div class="register-link">

        Don't have an account?

        <a href="/register">
            Register
        </a>

    </div> -->

</div>

</body>

</html>
