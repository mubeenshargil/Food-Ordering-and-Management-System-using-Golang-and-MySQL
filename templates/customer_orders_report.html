{{ template "header" . }}

{{ template "sidebar" . }}

{{ template "topbar" . }}

<div class="content">

    <div class="card">

        <div class="card-header">

            <h3>
                Customer Orders Report
            </h3>

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover reportTab">

                <thead>

                    <tr>
                        <th>Customer</th>
                        <th>Email</th>
                        <th>Total Orders</th>
                        <th>Total Spending (€)</th>
                    </tr>

                </thead>

                <tbody>

                    {{ range .report }}

                    <tr>

                        <td>{{ .CustomerName }}</td>

                        <td>{{ .Email }}</td>

                        <td>{{ .TotalOrders }}</td>

                        <td>
                            €{{ printf "%.2f" .TotalSpending }}
                        </td>

                    </tr>

                    {{ end }}

                </tbody>

            </table>

        </div>

    </div>

</div>

{{ template "footer" . }}
