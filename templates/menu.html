<!DOCTYPE html>
<html>

<head>
    <title>Restaurant Menu</title>

    <style>
        body{
            font-family:Arial;
            background:#f5f5f5;
        }

        .container{
            width:1200px;
            margin:auto;
        }

        .card{
            width:300px;
            background:white;
            padding:20px;
            margin:20px;
            float:left;
            border-radius:10px;
            box-shadow:0 0 10px #ccc;
        }

        img{
            width:100%;
            height:200px;
            object-fit:cover;
        }

        .btn{
            background:black;
            color:white;
            padding:10px 20px;
            text-decoration:none;
        }
    </style>

</head>

<body>

<div class="container">

<h1>🍔 Restaurant Menu</h1>

{{ range .menus }}

<div class="card">

    <img src="{{ .Image }}">

    <h2>{{ .Name }}</h2>

    <p>{{ .Description }}</p>

    <h3>${{ .Price }}</h3>

    <a class="btn" href="/checkout/{{ .ID }}">
        Order Now
    </a>

</div>

{{ end }}

</div>

</body>
</html>
