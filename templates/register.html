<!DOCTYPE html>
<html>

<head>

    <title>Register - Food Ordering System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body{
            background:#f5f5f5;
            font-family:Arial;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .register-box{
            width:550px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
        }

        .logo{
            text-align:center;
            margin-bottom:30px;
        }

        .logo h1{
            font-weight:bold;
        }

        .form-control{
            height:50px;
        }

        .btn-register{
            width:100%;
            height:50px;
            background:#212529;
            color:white;
            border:none;
        }

        .btn-register:hover{
            background:black;
        }

        .login-link{
            text-align:center;
            margin-top:20px;
        }

    </style>

</head>

<body>

<div class="register-box">

    <div class="logo">

        <h1>🍔 Food Ordering</h1>

        <p class="text-muted">
            Create your account
        </p>

    </div>

    <form action="/register" method="POST">

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    First Name
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="fa fa-user"></i>
                    </span>

                    <input type="text"
                           name="name"
                           class="form-control"
                           placeholder="Enter Name"
                           required>

                </div>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Last Name
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="fa fa-user"></i>
                    </span>

                    <input type="text"
                           name="surname"
                           class="form-control"
                           placeholder="Enter Surname"
                           required>

                </div>

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Phone Number
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="fa fa-phone"></i>
                </span>

                <input type="text"
                       name="phone"
                       class="form-control"
                       placeholder="Enter Phone Number"
                       required>

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Email Address
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="fa fa-envelope"></i>
                </span>

                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter Email"
                       required>

            </div>

        </div>

        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="fa fa-lock"></i>
                </span>

                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter Password"
                       required>

            </div>

        </div>
               <input type="hidden" name="status" value="0">
               <input type="hidden" name="role" value="customer">

        <button type="submit"
                class="btn btn-register">

            <i class="fa fa-user-plus"></i>
            Register

        </button>

    </form>

    <div class="login-link">

        Already have an account?

        <a href="/login">
            Login
        </a>

    </div>

</div>

</body>

</html>
